<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the background run under the notch and the home
     indicator. It also makes env(safe-area-inset-*) report real numbers instead
     of zero, which is what every inset in styles.css depends on. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rubik's Cube Coach</title>
<meta name="description" content="Scan your cube with the camera and follow the moves, one at a time.">
<link rel="stylesheet" href="css/styles.css">
</head>
<!--
  Three screens, one at a time, each exactly as tall as the window.

  The page itself never scrolls — body is a flex column of fixed height and the
  one flexible row on each screen (the cube, or the face being painted) is what
  gives up space. A phone that has to be scrolled to reach the next move is a
  phone being held in one hand next to a cube being held in the other.
-->
<body>

<header class="topbar">
  <span class="logo" aria-hidden="true"></span>
  <h1>Cube Coach</h1>
</header>

<!-- ───────────────────── home: scan, and little else ───────────────────── -->
<main id="view-setup" class="view view-home">
  <div class="size-picker" role="group" aria-label="Cube size">
    <button class="size-option" data-size="2">2×2</button>
    <button class="size-option is-active" data-size="3">3×3</button>
    <button class="size-option" data-size="4">4×4</button>
  </div>

  <div class="preview-wrap">
    <canvas id="preview-front" class="cube-canvas"></canvas>
    <canvas id="preview-back" class="cube-canvas small"></canvas>
  </div>

  <p id="setup-message" class="message" role="status"></p>

  <div class="home-actions">
    <button id="btn-scan" class="btn btn-scan">📷 Scan my cube</button>
    <p class="flat-note">Best on a flat surface in even light — stand the cube on a table and hold the phone over it.</p>
    <button id="btn-edit" class="btn btn-ghost">Type the colours in instead</button>
  </div>
</main>

<!-- ──────────── the map, one face at a time, same route as the scan ──────────── -->
<main id="view-edit" class="view view-edit" hidden>
  <div class="guide-row">
    <canvas id="edit-guide-canvas" class="guide-canvas"></canvas>
    <p class="guide-line">
      <span class="guide-arrow" id="edit-guide-arrow" aria-hidden="true"></span>
      <span id="edit-guide-text"></span>
    </p>
  </div>

  <!-- one face, as big as the screen will allow; app.js measures the box -->
  <div class="net-fit">
    <div class="net" id="net"></div>
  </div>

  <div class="palette" id="palette" role="toolbar" aria-label="Color picker"></div>

  <p id="edit-message" class="message" role="status"></p>

  <div class="row-buttons">
    <button id="btn-edit-prev" class="btn">‹ Back</button>
    <button id="btn-edit-next" class="btn btn-primary">Next face ›</button>
  </div>
  <div class="row-buttons row-quiet">
    <button id="btn-solve" class="btn btn-ghost">Solve now</button>
    <button id="btn-example" class="btn btn-ghost">Scramble</button>
    <button id="btn-clear" class="btn btn-ghost">Clear</button>
    <button id="btn-home" class="btn btn-ghost">← Home</button>
  </div>
</main>

<!-- ───────────────────────── follow the moves ───────────────────────── -->
<main id="view-solve" class="view view-solve" hidden>
  <div class="solve-top">
    <button id="btn-back" class="btn btn-ghost btn-icon" title="Back">←</button>
    <div class="progress"><div id="progress-fill" class="progress-fill"></div></div>
    <button id="btn-voice" class="btn btn-ghost btn-icon" title="Say &quot;next&quot; to move on" hidden>🎤</button>
    <span class="counter" id="move-counter">Move 0 of 0</span>
  </div>

  <p id="repair-note" class="repair-note" hidden></p>

  <div class="stage-canvases">
    <canvas id="solve-front-canvas" class="cube-canvas big"></canvas>
  </div>

  <div class="instruction-card" id="instruction-card">
    <h2 class="move-title" id="move-title">Ready</h2>
    <p class="move-detail" id="move-detail">Tap Next to make the first move.</p>
  </div>

  <div class="transport">
    <button id="btn-prev" class="btn" title="Previous move (←)">‹ Back</button>
    <button id="btn-replay" class="btn btn-icon" title="Show this move again">↻</button>
    <button id="btn-next" class="btn btn-primary btn-next" title="Next move (→)">Next ›</button>
  </div>

  <button id="btn-restart" class="btn btn-ghost btn-restart">Not solved? Start over</button>
</main>

<!-- ───────────────────────── scanner ───────────────────────── -->
<div id="scanner" class="modal" hidden>
  <div class="modal-card">
    <h2 id="scan-title">Face 1 of 6</h2>
    <!--
      Two cubes, and that is the point of this screen: what the camera sees, and
      what has been understood from it. The second one is the only way to know
      the read is right before the moves are written for it — and when a face
      lands, it turns, which is also the instruction for what to do next.
    -->
    <div class="scan-layout">
      <div class="scan-stage">
        <video id="scan-video" playsinline muted autoplay></video>
        <canvas id="scan-overlay" class="scan-overlay" aria-hidden="true"></canvas>
        <!-- the blink that says a photo was just taken; nothing else on screen
             moves when the scanner takes one by itself -->
        <div id="scan-flash" class="scan-flash" aria-hidden="true"></div>
      </div>

      <div class="guide-row scan-guide">
        <canvas id="scan-guide-canvas" class="guide-canvas"></canvas>
        <p class="guide-line">
          <span class="guide-arrow" id="scan-arrow" aria-hidden="true"></span>
          <span id="scan-guide-text"></span>
        </p>
      </div>

      <div class="scan-side">
        <div id="scan-thumbs" class="scan-thumbs"></div>
        <div class="row-buttons scan-buttons">
          <button id="scan-capture" class="btn btn-primary btn-snap">Snap</button>
          <button id="scan-undo" class="btn">Redo last</button>
          <button id="scan-close" class="btn btn-ghost">Cancel</button>
        </div>
        <p id="scan-message" class="message"></p>
      </div>
    </div>
    <canvas id="scan-canvas" hidden></canvas>
  </div>
</div>

<div id="prep" class="modal" hidden>
  <div class="modal-card modal-small">
    <h2>Working it out</h2>
    <p class="hint" id="prep-label">Building the lookup tables — a few seconds, once per visit.</p>
    <div class="progress"><div id="prep-fill" class="progress-fill"></div></div>
  </div>
</div>

<canvas id="confetti" class="confetti" aria-hidden="true" hidden></canvas>

<script src="js/cube.js"></script>
<script src="js/cuben.js"></script>
<script src="js/kociemba.js"></script>
<script src="js/solver2.js"></script>
<script src="js/tpr.js"></script>
<script src="js/solver4.js"></script>
<script src="js/render.js"></script>
<script src="js/guide.js"></script>
<script src="js/detect.js"></script>
<script src="js/assemble.js"></script>
<script src="js/assemble4.js"></script>
<script src="js/repair.js"></script>
<script src="js/autosnap.js"></script>
<script src="js/celebrate.js"></script>
<script src="js/voice.js"></script>
<script src="js/scan.js"></script>
<script src="js/app.js"></script>
</body>
</html>
